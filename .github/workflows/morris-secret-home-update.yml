name: Update Morris Secret home

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Morris Secret home image
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3I2R8XV0b9op50LbwH2h8azHhrT/36a03459-cbd4-43bb-83c6-1bc9b0dcd252.jpg' -o morris-secret/home.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("morris-secret/index.html")
          s = p.read_text()
          old = '#home{justify-content:flex-end;padding-bottom:max(28px,env(safe-area-inset-bottom));background:linear-gradient(transparent 43%,#090706 72%),url("https://raw.githubusercontent.com/Morris1919/-photo360-ai/main/morris-esp/morris.jpg") center 22%/cover no-repeat}'
          new = '#home{justify-content:flex-end;padding-bottom:max(28px,env(safe-area-inset-bottom));background:url("home.jpg") center center/cover no-repeat}'
          if old not in s and new not in s:
              raise SystemExit("Expected HOME CSS not found; refusing to modify anything else.")
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morris-secret/home.jpg morris-secret/index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Update Morris Secret home background"
          git push
