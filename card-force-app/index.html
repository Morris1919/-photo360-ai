<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Card Force v5</title>
<style>
:root{--accent:#d8b25e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#cardImg{
  display:block;
  width:min(96vw,calc(94dvh * .7197));
  max-height:94dvh;
  height:auto;
  object-fit:contain;
  filter:drop-shadow(0 26px 45px rgba(0,0,0,.6));
  transform:translateZ(0);
}
.flash{animation:land .10s ease-out}
@keyframes land{0%{transform:scale(.985)}100%{transform:scale(1)}}
#hint{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.20);opacity:0;z-index:10;transition:opacity .15s}
#hint.show{opacity:1}
#hotspot{position:fixed;top:0;left:0;width:155px;height:155px;z-index:70;background:transparent}
#setup{position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,#070707,#151515);display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));overflow:auto}
#setup.hidden{display:none}
h1{font-size:24px;margin:4px 0 6px}.sub{font-size:14px;color:#9b9b9b;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pick{border:1px solid #333;background:#181818;color:#fff;border-radius:12px;padding:12px 5px;font-size:18px;font-weight:700;min-height:52px}
.pick.red{color:#ff525a}.pick.selected{outline:2px solid var(--accent);background:#282313}
.actions{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,#151515 28%)}
button.primary,button.secondary{border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:800;flex:1}
button.primary{background:#f2f2f2;color:#050505}button.secondary{background:#252525;color:#fff}
#loading{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;font-size:14px;color:#aaa}
#loading.hidden{display:none}
</style>
</head>
<body>
<div id="loading">Caricamento mazzo…</div>
<div id="stage"><img id="cardImg" alt="Carta da gioco" draggable="false"></div>
<div id="hotspot" aria-hidden="true"></div>
<div id="hint">tocca per ripartire</div>

<section id="setup">
  <h1>Carta da forzare</h1>
  <p class="sub">Scegli la carta, poi premi INIZIA.</p>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <button class="secondary" id="randomBtn">Casuale</button>
    <button class="primary" id="startBtn">INIZIA</button>
  </div>
</section>

<script>
const BASE='https://deckofcardsapi.com/static/img/';
const suits=[
  {code:'S',symbol:'♠',name:'Picche',red:false},
  {code:'H',symbol:'♥',name:'Cuori',red:true},
  {code:'D',symbol:'♦',name:'Quadri',red:true},
  {code:'C',symbol:'♣',name:'Fiori',red:false}
];
const ranks=[
  {label:'A',code:'A'},{label:'2',code:'2'},{label:'3',code:'3'},{label:'4',code:'4'},
  {label:'5',code:'5'},{label:'6',code:'6'},{label:'7',code:'7'},{label:'8',code:'8'},
  {label:'9',code:'9'},{label:'10',code:'0'},{label:'J',code:'J'},{label:'Q',code:'Q'},{label:'K',code:'K'}
];
const deck=suits.flatMap(s=>ranks.map(r=>({
  label:r.label,symbol:s.symbol,name:r.label+' di '+s.name,red:s.red,
  apiCode:r.code+s.code,url:BASE+r.code+s.code+'.png'
})));
const key=c=>c.apiCode;

let forcedCode=localStorage.getItem('forcedCardCode')||'AS';
let forced=deck.find(c=>c.apiCode===forcedCode)||deck[0];
let running=false,timer=null,longTimer=null,tapCount=0,tapReset=null,lastCode='',suppressUntil=0;

const img=document.getElementById('cardImg');
const setup=document.getElementById('setup');
const hint=document.getElementById('hint');
const loading=document.getElementById('loading');

function show(c,flash=false){
  img.src=c.url;
  img.alt=c.name;
  if(flash){
    img.classList.remove('flash');
    void img.offsetWidth;
    img.classList.add('flash');
  }
}
function randomCard(){
  let c;
  do{c=deck[Math.floor(Math.random()*deck.length)]}while(c.apiCode===lastCode);
  lastCode=c.apiCode;
  return c;
}
function tick(){
  if(!running)return;
  show(randomCard());
  timer=setTimeout(tick,55+Math.random()*35);
}
function startRun(){
  clearTimeout(timer);
  running=true;
  hint.classList.remove('show');
  tick();
}
function stopNow(){
  if(!running)return;
  running=false;
  clearTimeout(timer);
  show(forced,true);
  if(navigator.vibrate)navigator.vibrate(14);
  setTimeout(()=>hint.classList.add('show'),150);
}
function renderGrid(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  deck.forEach(c=>{
    const b=document.createElement('button');
    b.className='pick'+(c.red?' red':'')+(c.apiCode===forced.apiCode?' selected':'');
    b.textContent=c.label+' '+c.symbol;
    b.onclick=()=>{
      forced=c;
      localStorage.setItem('forcedCardCode',forced.apiCode);
      renderGrid();
      show(forced);
    };
    g.appendChild(b);
  });
}
function openSetup(){
  suppressUntil=Date.now()+700;
  running=false;
  clearTimeout(timer);
  hint.classList.remove('show');
  setup.classList.remove('hidden');
  renderGrid();
  show(forced);
}
function closeSetup(){
  setup.classList.add('hidden');
  suppressUntil=Date.now()+450;
  startRun();
}

document.getElementById('startBtn').onclick=closeSetup;
document.getElementById('randomBtn').onclick=()=>{
  forced=deck[Math.floor(Math.random()*deck.length)];
  localStorage.setItem('forcedCardCode',forced.apiCode);
  renderGrid();
  show(forced);
};

const hotspot=document.getElementById('hotspot');
function secretStart(e){
  if(!setup.classList.contains('hidden'))return;
  if(e)e.preventDefault();
  clearTimeout(longTimer);
  longTimer=setTimeout(()=>{tapCount=0;openSetup()},850);
}
function secretEnd(e){
  if(!setup.classList.contains('hidden'))return;
  if(e)e.preventDefault();
  clearTimeout(longTimer);
  tapCount++;
  clearTimeout(tapReset);
  tapReset=setTimeout(()=>tapCount=0,900);
  if(tapCount>=3){
    tapCount=0;
    clearTimeout(tapReset);
    openSetup();
  }
}
hotspot.addEventListener('touchstart',secretStart,{passive:false});
hotspot.addEventListener('touchend',secretEnd,{passive:false});
hotspot.addEventListener('touchcancel',()=>clearTimeout(longTimer),{passive:false});
hotspot.addEventListener('mousedown',secretStart);
hotspot.addEventListener('mouseup',secretEnd);
hotspot.addEventListener('contextmenu',e=>e.preventDefault());

document.getElementById('stage').addEventListener('pointerup',()=>{
  if(Date.now()<suppressUntil || !setup.classList.contains('hidden'))return;
  running?stopNow():startRun();
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden)clearTimeout(timer);
  else if(running)tick();
});

async function preload(){
  let done=0;
  await Promise.all(deck.map(c=>new Promise(resolve=>{
    const p=new Image();
    p.onload=p.onerror=()=>{done++;resolve()};
    p.src=c.url;
  })));
  loading.classList.add('hidden');
}
renderGrid();
show(forced);
preload();
</script>
</body>
</html>
